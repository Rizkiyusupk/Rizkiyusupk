name: Generate GitHub Profile Summary Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub Profile Summary Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          user: Rizkiyusupk
          theme: github_dark
          template: classic
